# Datasource points at the Testcontainers Postgres instance; the DB_* system properties are set
# by PostgresContainer when it starts.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/spotify}
spring.datasource.username=${DB_USERNAME:spotify}
spring.datasource.password=${DB_PASSWORD:spotify}

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

history.spotifyClientId=test-client-id
history.spotifyClientSecret=test-client-secret
history.spotifyBaseRedirectUri=http://localhost:28080/get-user-code

# Both scheduled jobs would otherwise fire the moment the context starts, before any scenario has
# had a chance to set up its stubs. Push the first run an hour out so nothing calls Spotify until a
# scenario triggers the job itself through SpotifyJobSteps.
history.playHistoryInitialDelayMs=3600000
history.refreshTokenInitialDelayMs=3600000
