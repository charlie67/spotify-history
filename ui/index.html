<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Page</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">

    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha384-fgGyf7Mo7DURSOMnOy7ed+dkq5Job205Gnzu6QIg0BOHKaqt4D76Dt8VlDCzcMHV" crossorigin="anonymous"></script>

</head>
<body>
<main>
    <section class="card sign-in" aria-label="Sign in">
        <div id="status" class="status" hidden>
            <h1 id="header-message"></h1>
        </div>
        <button type="button" class="button" onclick="LandingPage()">Sign in</button>
    </section>

    <section class="card" aria-labelledby="playlist-heading">
        <h2 id="playlist-heading">Playlist Creation</h2>
        <form action="#" id="form" class="playlist-form" onsubmit="sendCommand();return false;">
            <label class="field" for="startTime">Start Time
                <input id="startTime" name="startTime" type="date">
            </label>

            <label class="field" for="endTime">End Time
                <input id="endTime" name="endTime" type="date">
            </label>

            <label class="field" for="amount">Amount
                <input id="amount" name="amount" type="text">
            </label>

            <label class="field" for="name">Name
                <input id="name" name="name" type="text">
            </label>

            <button class="button">Send</button>
        </form>
    </section>
</main>
</body>
</html>

<script>
    window.onload = function () {
        areLoggedIn();
    };

    function areLoggedIn() {
        fetch("/api/authStatus")
            .then((response) => response.json())
            .then(status => {
                console.log(status)
                // A refresh token Spotify has rejected has already been thrown away, so the only way
                // back is signing in again - say so rather than leaving the user to work out why the
                // history stopped.
                if (status.reauthorisationRequired) {
                    showStatus("warn", "Your Spotify sign in has expired. Please sign in again to carry on recording.");
                } else if (status.loggedIn) {
                    showStatus("ok", "Already logged in. Click here to login to a different account." + expiryMessage(status));
                } else {
                    showStatus("info", "Please login with Spotify to get started!");
                }
            })
    }

    function showStatus(kind, message) {
        $("#status").removeClass("status--ok status--warn").addClass(kind === "info" ? "" : "status--" + kind).prop("hidden", false);
        $("#header-message").text(message);
    }

    // Spotify sign ins last six months. Showing the date gives some warning before the recording
    // stops, instead of it only turning up in the logs.
    function expiryMessage(status) {
        if (!status.refreshTokenExpiresAt) {
            return "";
        }

        return " This sign in expires on " + new Date(status.refreshTokenExpiresAt).toLocaleDateString() + ".";
    }

    function LandingPage() {
        fetch("/api/login", {mode: 'no-cors'})
            .then((response) => response.text())
            .then(response => {
                window.location.replace(response);
            })
    }

    function sendCommand() {
        let startTime = document.getElementById('startTime').value.replace(/-/g, '');
        let endTime = document.getElementById('endTime').value.replace(/-/g, '');
        let amount = document.getElementById('amount').value;
        let name = document.getElementById('name').value;

        let endpoint = `/api/playlist/create/${startTime}/${endTime}/${amount}?name=${name}`

        console.log(endpoint)

        fetch(endpoint, {
            method: 'POST',
            mode: 'cors',
            headers: {
                'Content-Type': 'application/json'
            }
        })
            .then(response => {
                console.log(response)
            })
    }
</script>
