<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

</head>
<body>
<h1 id="header-message">.</h1>
<button onclick="LandingPage()">Sign in</button>

<h1>Playlist Creation</h1>
<form action="#" id="form" onsubmit="sendCommand();return false;">

    <label for="startTime">Start Time</label>
    <input id="startTime" name="startTime" type="date"><br><br>

    <label for="endTime">End Time</label>
    <input id="endTime" name="endTime" type="date"><br><br>

    <label for="amount">Amount</label>
    <input id="amount" name="amount" type="text"><br><br>

    <label for="name">Name</label>
    <input id="name" name="name" type="text"><br><br>

    <button>Send</button>
</form>
</body>
</html>

<script>
    window.onload = function () {
        areLoggedIn();
    };

    function areLoggedIn() {
        fetch("/api/authStatus")
            .then((response) => response.json())
            .then(status => {
                console.log(status)
                // A refresh token Spotify has rejected has already been thrown away, so the only way
                // back is signing in again - say so rather than leaving the user to work out why the
                // history stopped.
                if (status.reauthorisationRequired) {
                    $("#header-message").text("Your Spotify sign in has expired. Please sign in again to carry on recording.");
                } else if (status.loggedIn) {
                    $("#header-message").text("Already logged in. Click here to login to a different account." + expiryMessage(status));
                } else {
                    $("#header-message").text("Please login with Spotify to get started!");
                }
            })
    }

    // Spotify sign ins last six months. Showing the date gives some warning before the recording
    // stops, instead of it only turning up in the logs.
    function expiryMessage(status) {
        if (!status.refreshTokenExpiresAt) {
            return "";
        }

        return " This sign in expires on " + new Date(status.refreshTokenExpiresAt).toLocaleDateString() + ".";
    }

    function LandingPage() {
        fetch("/api/login", {mode: 'no-cors'})
            .then((response) => response.text())
            .then(response => {
                window.location.replace(response);
            })
    }

    function sendCommand() {
        let startTime = document.getElementById('startTime').value.replace(/-/g, '');
        let endTime = document.getElementById('endTime').value.replace(/-/g, '');
        let amount = document.getElementById('amount').value;
        let name = document.getElementById('name').value;

        let endpoint = `/api/playlist/create/${startTime}/${endTime}/${amount}?name=${name}`

        console.log(endpoint)

        fetch(endpoint, {
            method: 'POST',
            mode: 'cors',
            headers: {
                'Content-Type': 'application/json'
            }
        })
            .then(response => {
                console.log(response)
            })
    }
</script>
